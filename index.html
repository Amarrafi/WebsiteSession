<!DOCTYPE html>
<html lang='en'>

<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='style.css'>
    <style>
        h1{
            color: red;
        }
    </style>
</head>

<body>
    <h1 style="color: aqua;">Hello</h1>
    <p id="demo">hallo amar</p>

    <input type="text" id="input">
    <button onclick="document.getElementById('list').insertAdjacentHTML('beforeend', `<li>${document.getElementById('input').value}</li>`)">input item</button>
    <ul id="list">
        <li>Coffee</li>
        <li>Tea</li>
        <li>Milk</li>
    </ul>

    <button onclick="document.getElementById('list').innerHTML = '';">reset item</button>

    <link rel="script" href="script.js">
    
</body>

</html>
